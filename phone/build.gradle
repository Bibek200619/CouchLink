plugins { id 'com.android.application' }
android {
    namespace 'dev.couchlink.phone'
    compileSdk 34
    defaultConfig { applicationId 'dev.couchlink.phone'; minSdk 26; targetSdk 34; versionCode 4; versionName '2.1' }
    sourceSets.main { assets.srcDirs = ['../ui']; java.srcDirs += ['../android-shared'] }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation project(':core') }
